version: "3.8"

# ──────────────────────────────────────────────
#  Redis for Obsidian search result cache
#  Owner: Search Database Administrator
# ──────────────────────────────────────────────

services:

  redis:
    image: redis:7.2-alpine
    container_name: obsidian-redis
    command: >
      redis-server
      --maxmemory            256mb
      --maxmemory-policy     allkeys-lru
      --save                 ""
      --appendonly           no
      --tcp-keepalive        60
      --timeout              300
      --loglevel             notice
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - obsidian-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  obsidian-net:
    external: true
