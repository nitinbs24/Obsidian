# redis.conf — Obsidian search result cache
# Owner: Search Database Administrator (Priyadarshini Sarja)

# ── Network ────────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# ── Memory — LRU eviction, 256 MB cap ─────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ── Persistence — disabled (cache is ephemeral) ────────────────────────────────
save ""
appendonly no

# ── Performance ────────────────────────────────────────────────────────────────
hz 20
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# ── Logging ────────────────────────────────────────────────────────────────────
loglevel notice
